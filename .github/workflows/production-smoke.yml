name: FocusOS Cloud Smoke Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Run existing tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test deployed website
        run: npx playwright test tests/production-smoke.spec.js
        env:
          BASE_URL: https://focusos-7cd08.web.app
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focusos-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
