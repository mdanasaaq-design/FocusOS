name: FocusOS CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for Firebase emulator
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: demo-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-focusos.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-focusos
          VITE_FIREBASE_STORAGE_BUCKET: demo-focusos.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: demo-sender
          VITE_FIREBASE_APP_ID: demo-app
          VITE_FIREBASE_EMULATORS: "true"
      - name: Start Firebase emulators
        run: |
          npx --yes firebase-tools@15.2.0 emulators:start --only auth,firestore --project demo-focusos > /tmp/firebase-emulators.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4000/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
      - name: Seed E2E account
        run: |
          RESPONSE=$(curl -fsS -X POST "http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signUp?key=demo-api-key"             -H "Content-Type: application/json"             -d '{"email":"e2e@focusos.test","password":"FocusOS-e2e-2026!","returnSecureToken":true}')
          UID=$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["localId"])')
          curl -fsS -X PATCH "http://127.0.0.1:8080/v1/projects/demo-focusos/databases/(default)/documents/users/$UID/profile/main"             -H "Content-Type: application/json"             -H "Authorization: Bearer owner"             -d '{"fields":{"name":{"stringValue":"E2E User"},"onboardingCompleted":{"booleanValue":true},"hijriAdjustmentDays":{"integerValue":"0"}}}'
          curl -fsS -X PATCH "http://127.0.0.1:8080/v1/projects/demo-focusos/databases/(default)/documents/users/$UID/config/main"             -H "Content-Type: application/json"             -H "Authorization: Bearer owner"             -d '{"fields":{"preferences":{"mapValue":{"fields":{"language":{"stringValue":"en"},"locale":{"stringValue":"en-IN"},"timeFormat":{"stringValue":"24h"},"timeZone":{"stringValue":"Asia/Kolkata"},"clock":{"mapValue":{"fields":{"enabled":{"booleanValue":true},"showSeconds":{"booleanValue":true}}}},"greeting":{"mapValue":{"fields":{"enabled":{"booleanValue":true},"prefixEnabled":{"booleanValue":true},"prefixText":{"stringValue":"Assalamualaikum warahmatullahi wabarakatuhu"},"includeName":{"booleanValue":true},"mode":{"stringValue":"time"}}}}}}}}'
      - name: Install Playwright
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Run browser regression tests
        run: npx --yes playwright@1.55.0 test e2e
        env:
          CI: "true"
