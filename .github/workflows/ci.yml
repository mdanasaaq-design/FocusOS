name: FocusOS CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Build for Firebase emulator
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: demo-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-focusos.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-focusos
          VITE_FIREBASE_STORAGE_BUCKET: demo-focusos.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: demo-sender
          VITE_FIREBASE_APP_ID: demo-app
          VITE_FIREBASE_EMULATORS: "true"
      - name: Start Firebase emulators
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.2.0 emulators:start --only auth,firestore --project demo-focusos > /tmp/firebase-emulators.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:9099/emulator/v1/projects/demo-focusos/config" >/dev/null 2>&1 &&
               curl -fsS "http://127.0.0.1:8080/" >/dev/null 2>&1; then
              echo "Firebase Auth and Firestore emulators are ready."
              exit 0
            fi
            sleep 2
          done
          echo "Firebase emulators did not become ready."
          cat /tmp/firebase-emulators.log
          exit 1
      - name: Seed E2E account
        run: |
          set -euo pipefail
          if ! RESPONSE=$(curl -fsS -X POST "http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signUp?key=demo-api-key"             -H "Content-Type: application/json"             -d '{"email":"e2e@focusos.test","password":"FocusOS-e2e-2026!","returnSecureToken":true}'); then
            echo "Firebase Auth emulator rejected the seed request."
            cat /tmp/firebase-emulators.log
            exit 1
          fi
          FIREBASE_UID=$(printf '%s' "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["localId"])')
          curl -fsS -X PATCH "http://127.0.0.1:8080/v1/projects/demo-focusos/databases/(default)/documents/users/$FIREBASE_UID/profile/main"             -H "Content-Type: application/json"             -H "Authorization: Bearer owner"             -d '{"fields":{"name":{"stringValue":"E2E User"},"onboardingCompleted":{"booleanValue":true},"hijriAdjustmentDays":{"integerValue":"0"}}}'
          echo "E2E preferences use application defaults."
          curl -fsS -X POST "http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=demo-api-key" -H "Content-Type: application/json" -d '{"email":"e2e@focusos.test","password":"FocusOS-e2e-2026!","returnSecureToken":true}' >/tmp/e2e-signin.json
          echo "E2E Auth REST sign-in succeeded."
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Run browser regression tests
        run: npx --yes playwright@1.55.0 test e2e
        env:
          CI: "true"
